# Hostinger Docker Manager — Mallanet Discord bots
# Repo is cloned by Hostinger; build context is repo root.
services:
  malla-onboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: malla-onboard
    restart: unless-stopped
    environment:
      ONBOARD_TOKEN: ${ONBOARD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      ROLE_VERIFICADO: ${ROLE_VERIFICADO}
      ROLE_PENDIENTE: ${ROLE_PENDIENTE}
      ROLE_MALLANET: ${ROLE_MALLANET}
      ROLE_ROOT: ${ROLE_ROOT}
      CHANNEL_REGLAS: ${CHANNEL_REGLAS}
      CHANNEL_VERIFICACION: ${CHANNEL_VERIFICACION}
      CHANNEL_BOT_ADMIN: ${CHANNEL_BOT_ADMIN}
      CHANNEL_LOGS: ${CHANNEL_LOGS}
      APPROVER_ROLE_IDS: ${APPROVER_ROLE_IDS}
    command: ["python", "-m", "mallabot.onboard"]

  malla-watch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: malla-watch
    restart: unless-stopped
    environment:
      WATCH_TOKEN: ${WATCH_TOKEN}
      GUILD_ID: ${GUILD_ID}
      ROLE_VERIFICADO: ${ROLE_VERIFICADO}
      ROLE_PENDIENTE: ${ROLE_PENDIENTE}
      ROLE_MALLANET: ${ROLE_MALLANET}
      ROLE_ROOT: ${ROLE_ROOT}
      CHANNEL_REGLAS: ${CHANNEL_REGLAS}
      CHANNEL_VERIFICACION: ${CHANNEL_VERIFICACION}
      CHANNEL_BOT_ADMIN: ${CHANNEL_BOT_ADMIN}
      CHANNEL_LOGS: ${CHANNEL_LOGS}
      APPROVER_ROLE_IDS: ${APPROVER_ROLE_IDS}
    command: ["python", "-m", "mallabot.watch"]
